# .github/workflows/ci.yml
# CI pipeline for pull requests — typecheck, lint, test, build, Lighthouse audit

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src --ext .ts,.tsx,.astro --max-warnings 0
      - run: npx prettier --check .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --passWithNoTests

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/build-agent-data.ts
      - name: Fetch Sanity CMS content
        run: npx tsx scripts/fetch-sanity-content.ts
        continue-on-error: true
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          # Add RESEND_API_KEY to GitHub repo secrets: Settings > Secrets > Actions
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - run: npx pagefind --site dist

      # Lighthouse audit on built site
      - name: Serve and audit
        run: |
          npx serve dist -l 4321 &
          sleep 3
          npx lighthouse http://localhost:4321/195_shades_of_agents-/ \
            --output json --output-path ./lighthouse.json \
            --chrome-flags="--headless --no-sandbox"
          node -e "
            const r = require('./lighthouse.json');
            const scores = {
              performance: r.categories.performance.score * 100,
              accessibility: r.categories.accessibility.score * 100,
              'best-practices': r.categories['best-practices'].score * 100,
              seo: r.categories.seo.score * 100,
            };
            console.log('Lighthouse scores:', scores);
            const failed = Object.entries(scores).filter(([k, v]) => v < 90);
            if (failed.length) {
              console.error('FAILED:', failed);
              process.exit(1);
            }
          "

  test-e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/build-agent-data.ts
      - name: Fetch Sanity CMS content
        run: npx tsx scripts/fetch-sanity-content.ts
        continue-on-error: true
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          # Add RESEND_API_KEY to GitHub repo secrets: Settings > Secrets > Actions
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - run: npx pagefind --site dist
      - run: npx playwright install --with-deps
      - run: npx playwright test
