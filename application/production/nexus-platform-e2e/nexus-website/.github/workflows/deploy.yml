# .github/workflows/deploy.yml
# Build and deploy the NEXUS AI website to GitHub Pages
# Triggers: push to main, manual dispatch, Sanity webhook

name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger (e.g., after Sanity content update)
  repository_dispatch:
    types: [sanity-content-update] # Triggered by Sanity webhook

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx,.astro --max-warnings 0
        continue-on-error: true # Non-blocking in Sprint 1 until ESLint is fully configured

      - name: Run tests
        run: npx vitest run --passWithNoTests
        continue-on-error: true # Non-blocking until test suite exists

      - name: Pre-build — Parse agent data
        run: npx tsx scripts/build-agent-data.ts

      - name: Pre-build — Fetch Sanity CMS content
        run: npx tsx scripts/fetch-sanity-content.ts
        continue-on-error: true # Graceful skip if Sanity not yet configured
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      - name: Build Astro site
        run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      - name: Post-build — Generate search index
        run: npx pagefind --site dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
