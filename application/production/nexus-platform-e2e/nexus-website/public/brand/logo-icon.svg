<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>NEXUS AI Icon</title>
  <desc>NEXUS AI hexagonal icon mark</desc>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="31" fill="#0A0E27" stroke="url(#g)" stroke-width="0.75" opacity="0.8"/>

  <!-- Hex: center (32,32), r=24 -->
  <!-- Vertices: (32,8),(52.78,20),(52.78,44),(32,56),(11.22,44),(11.22,20) -->
  <polygon points="32,8 52.78,20 52.78,44 32,56 11.22,44 11.22,20"
           fill="url(#gFill)"/>
  <polygon points="32,8 52.78,20 52.78,44 32,56 11.22,44 11.22,20"
           fill="none" stroke="url(#g)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- N internal geometry -->
  <g filter="url(#glow)">
    <line x1="18" y1="21" x2="18" y2="43" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="21" x2="46" y2="43" stroke="url(#g)"  stroke-width="2"   stroke-linecap="round" opacity="0.9"/>
    <line x1="46" y1="21" x2="46" y2="43" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 6 vertex dots -->
  <circle cx="32"    cy="8"     r="2" fill="#00D9FF" filter="url(#glow)"/>
  <circle cx="52.78" cy="20"    r="2" fill="#00D9FF" opacity="0.8"/>
  <circle cx="52.78" cy="44"    r="2" fill="#7C3AED" opacity="0.8"/>
  <circle cx="32"    cy="56"    r="2" fill="#7C3AED" filter="url(#glow)"/>
  <circle cx="11.22" cy="44"    r="2" fill="#7C3AED" opacity="0.8"/>
  <circle cx="11.22" cy="20"    r="2" fill="#00D9FF" opacity="0.8"/>
</svg>
