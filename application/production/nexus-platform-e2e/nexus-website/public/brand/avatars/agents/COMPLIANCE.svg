  <path d="M58,42.5 L59.5,44 L61.5,41" stroke="#22c55e" stroke-width="0.8" fill="none"/>
  <path d="M58,45.5 L59.5,47 L61.5,44" stroke="#22c55e" stroke-width="0.8" fill="none"/>
  <circle cx="64" cy="46" r="1.2" fill="#94a3b8" opacity="0.8"/>
