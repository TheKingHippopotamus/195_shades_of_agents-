  <rect x="47" y="55" width="6" height="4" rx="1" fill="none" stroke="#94a3b8" stroke-width="0.7" opacity="0.5"/>
  <!-- Mouth: flat regulatory line -->
  <line x1="36" y1="64" x2="64" y2="64" stroke="#94a3b8" stroke-width="1.2"/>
