<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Marketing</title>
  <!-- Megaphone body -->
  <path d="M6,18 L6,30 L14,30 L32,40 L32,8 L14,18 Z"
        fill="none" stroke="#EC4899" stroke-width="2" stroke-linejoin="round"/>
  <!-- Grip handle line at bell -->
  <line x1="14" y1="18" x2="14" y2="30" stroke="#EC4899" stroke-width="1.5" opacity="0.5"/>
  <!-- Sound waves -->
  <path d="M36,18 Q41,24 36,30" fill="none" stroke="#EC4899" stroke-width="2" stroke-linecap="round"/>
  <path d="M39,14 Q47,24 39,34" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Star/sparkle (viral moment) -->
  <line x1="4"  y1="10" x2="4"  y2="14" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2"  y1="12" x2="6"  y2="12" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small stars -->
  <circle cx="9"  cy="6"  r="1.5" fill="#EC4899" opacity="0.8"/>
  <circle cx="4"  cy="37" r="1.5" fill="#EC4899" opacity="0.6"/>
  <!-- Audience dots below -->
  <circle cx="8"  cy="44" r="2" fill="#EC4899" opacity="0.3"/>
  <circle cx="16" cy="44" r="2" fill="#EC4899" opacity="0.3"/>
  <circle cx="24" cy="44" r="2" fill="#EC4899" opacity="0.3"/>
</svg>
