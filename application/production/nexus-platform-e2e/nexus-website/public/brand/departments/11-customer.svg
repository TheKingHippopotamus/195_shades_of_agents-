<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Customer Success &amp; Support</title>
  <!-- Headset band arc -->
  <path d="M8,26 Q8,8 24,8 Q40,8 40,26" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <rect x="4" y="24" width="8" height="12" rx="4" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <!-- Right ear cup -->
  <rect x="36" y="24" width="8" height="12" rx="4" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <!-- Mic arm -->
  <path d="M8,32 Q8,38 14,40 L18,40" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <!-- Mic tip -->
  <circle cx="20" cy="40" r="2.5" fill="none" stroke="#06B6D4" stroke-width="1.75"/>
  <circle cx="20" cy="40" r="1"   fill="#06B6D4"/>
  <!-- Pulse heartbeat line (customer satisfaction) -->
  <polyline points="24,26 28,26 30,20 32,32 34,24 36,24"
            fill="none" stroke="#06B6D4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
