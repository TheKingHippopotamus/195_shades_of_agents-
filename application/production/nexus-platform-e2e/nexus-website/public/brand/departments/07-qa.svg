<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Quality Assurance</title>
  <!-- Shield shape -->
  <path d="M24,4 L40,10 L40,24 Q40,36 24,44 Q8,36 8,24 L8,10 Z"
        fill="none" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner shield layer -->
  <path d="M24,9 L36,14 L36,24 Q36,33 24,39 Q12,33 12,24 L12,14 Z"
        fill="none" stroke="#10B981" stroke-width="1" opacity="0.35"/>
  <!-- Checkmark -->
  <polyline points="15,24 21,30 33,18"
            fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Test node dots at shield points -->
  <circle cx="24"  cy="4"  r="2" fill="#10B981"/>
  <circle cx="40"  cy="10" r="2" fill="#10B981" opacity="0.6"/>
  <circle cx="8"   cy="10" r="2" fill="#10B981" opacity="0.6"/>
</svg>
