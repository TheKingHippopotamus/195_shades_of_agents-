<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Developer Relations</title>
  <!-- Terminal window -->
  <rect x="4" y="14" width="28" height="22" rx="3" fill="none" stroke="#00D9FF" stroke-width="1.75"/>
  <!-- Title bar -->
  <line x1="4" y1="20" x2="32" y2="20" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <!-- Cursor/prompt -->
  <text x="8" y="30" font-family="monospace" font-size="9" fill="#00D9FF" opacity="0.8">$ &gt;_</text>
  <!-- Code line 1 -->
  <line x1="8"  y1="33" x2="20" y2="33" stroke="#00D9FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Broadcast waves from terminal -->
  <path d="M36,20 Q40,24 36,28" fill="none" stroke="#00D9FF" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M38,16 Q46,24 38,32" fill="none" stroke="#00D9FF" stroke-width="1.5"  stroke-linecap="round" opacity="0.5"/>
  <path d="M40,12 Q48,24 40,36" fill="none" stroke="#00D9FF" stroke-width="1"    stroke-linecap="round" opacity="0.25"/>
  <!-- People nodes (developer community) -->
  <circle cx="6"  cy="6"  r="4" fill="none" stroke="#00D9FF" stroke-width="1.25" opacity="0.6"/>
  <circle cx="6"  cy="42" r="4" fill="none" stroke="#00D9FF" stroke-width="1.25" opacity="0.6"/>
  <!-- Connection lines to terminal -->
  <line x1="9"  y1="8"  x2="12" y2="14" stroke="#00D9FF" stroke-width="1" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="9"  y1="40" x2="12" y2="36" stroke="#00D9FF" stroke-width="1" opacity="0.3" stroke-dasharray="2,2"/>
</svg>
