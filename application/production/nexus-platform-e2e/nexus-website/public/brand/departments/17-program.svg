<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Program Management</title>
  <!-- Timeline axis -->
  <line x1="4" y1="12" x2="44" y2="12" stroke="#F59E0B" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <!-- Stage milestone dots on timeline -->
  <circle cx="8"  cy="12" r="2" fill="#F59E0B" opacity="0.7"/>
  <circle cx="18" cy="12" r="2" fill="#F59E0B" opacity="0.7"/>
  <circle cx="28" cy="12" r="2" fill="#F59E0B" opacity="0.7"/>
  <circle cx="38" cy="12" r="2" fill="#F59E0B"/>
  <!-- Gantt bar 1 (Sprint 1) -->
  <rect x="8"  y="18" width="14" height="6" rx="2" fill="#F59E0B" opacity="0.7"/>
  <!-- Gantt bar 2 (Sprint 2) -->
  <rect x="16" y="26" width="18" height="6" rx="2" fill="#F59E0B" opacity="0.55"/>
  <!-- Gantt bar 3 (Sprint 3) -->
  <rect x="26" y="34" width="14" height="6" rx="2" fill="#F59E0B" opacity="0.85"/>
  <!-- Arrow at end (delivery) -->
  <line x1="40" y1="12" x2="46" y2="12" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="43,9 46,12 43,15" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Label lines inside bars -->
  <line x1="10" y1="21" x2="20" y2="21" stroke="#0A0E27" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <line x1="18" y1="29" x2="32" y2="29" stroke="#0A0E27" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <line x1="28" y1="37" x2="38" y2="37" stroke="#0A0E27" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
</svg>
