<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img">
  <title>Tier 5 — Senior IC</title>
  <!-- Rounded square -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Inner rounded square -->
  <rect x="18" y="18" width="44" height="44" rx="10" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.35"/>
  <!-- 3 status dots (senior proficiency) -->
  <circle cx="28" cy="40" r="5" fill="#F59E0B"/>
  <circle cx="40" cy="40" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="40" r="5" fill="#F59E0B"/>
  <!-- Connecting lines -->
  <line x1="33" y1="40" x2="35" y2="40" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
  <line x1="45" y1="40" x2="47" y2="40" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
  <!-- Corner nodes -->
  <circle cx="8"  cy="8"  r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="72" cy="8"  r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="72" cy="72" r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="8"  cy="72" r="3" fill="#F59E0B" opacity="0.6"/>
</svg>
