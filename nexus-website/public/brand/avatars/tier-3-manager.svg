<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img">
  <title>Tier 3 — Manager</title>
  <!-- Rotated square (diamond) -->
  <rect x="20" y="20" width="40" height="40" rx="4" transform="rotate(45,40,40)"
        fill="none" stroke="#06B6D4" stroke-width="2.5"/>
  <!-- Inner diamond r=14 -->
  <rect x="26" y="26" width="28" height="28" rx="3" transform="rotate(45,40,40)"
        fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.35"/>
  <!-- Single manager bar -->
  <line x1="24" y1="40" x2="56" y2="40" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
  <!-- Vertical authority line -->
  <line x1="40" y1="28" x2="40" y2="36" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="44" x2="40" y2="52" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- 4 diamond vertex dots -->
  <circle cx="40" cy="12" r="3" fill="#06B6D4"/>
  <circle cx="68" cy="40" r="3" fill="#06B6D4"/>
  <circle cx="40" cy="68" r="3" fill="#06B6D4"/>
  <circle cx="12" cy="40" r="3" fill="#06B6D4"/>
</svg>
