<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img">
  <title>Tier 2 — Director</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Pentagon: center(40,40), r=32 -->
  <!-- Vertices at 90°,162°,234°,306°,378°: (40,8),(70.4,30.4),(58.7,66.4),(21.3,66.4),(9.6,30.4) -->
  <polygon points="40,8 70.4,30.4 58.7,66.4 21.3,66.4 9.6,30.4"
           fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <!-- Inner pentagon r=22 -->
  <polygon points="40,18 61.5,34.1 53.7,59.1 26.3,59.1 18.5,34.1"
           fill="none" stroke="url(#g)" stroke-width="1" opacity="0.35"/>
  <!-- 2 Director bars + title pip -->
  <line x1="24" y1="47" x2="56" y2="47" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="56" y2="40" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <!-- Director pip (top) -->
  <circle cx="40" cy="30" r="5" fill="none" stroke="url(#g)" stroke-width="2"/>
  <circle cx="40" cy="30" r="2" fill="url(#g)"/>
  <!-- Vertex dots -->
  <circle cx="40"  cy="8"    r="3" fill="#8B5CF6"/>
  <circle cx="70.4" cy="30.4" r="2" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="58.7" cy="66.4" r="2" fill="#6366F1" opacity="0.7"/>
  <circle cx="21.3" cy="66.4" r="2" fill="#6366F1" opacity="0.7"/>
  <circle cx="9.6"  cy="30.4" r="2" fill="#8B5CF6" opacity="0.7"/>
</svg>
