<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img">
  <title>Tier 1 — VP</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Hex badge: center(40,38), r=30 -->
  <!-- Pointy-top: (40,8),(65.98,23),(65.98,53),(40,68),(14.02,53),(14.02,23) -->
  <polygon points="40,8 65.98,23 65.98,53 40,68 14.02,53 14.02,23"
           fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <!-- Inner hex -->
  <polygon points="40,16 58.39,26.5 58.39,47.5 40,58 21.61,47.5 21.61,26.5"
           fill="none" stroke="url(#g)" stroke-width="1" opacity="0.35"/>
  <!-- 3 Chevrons (VP seniority) -->
  <polyline points="24,50 40,42 56,50" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="24,43 40,35 56,43" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="24,36 40,28 56,36" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top vertex dot -->
  <circle cx="40" cy="8" r="3.5" fill="#00D9FF"/>
  <!-- 6 vertex dots -->
  <circle cx="65.98" cy="23"    r="2" fill="#00D9FF" opacity="0.7"/>
  <circle cx="65.98" cy="53"    r="2" fill="#3B82F6" opacity="0.7"/>
  <circle cx="40"    cy="68"    r="2" fill="#3B82F6"/>
  <circle cx="14.02" cy="53"    r="2" fill="#3B82F6" opacity="0.7"/>
  <circle cx="14.02" cy="23"    r="2" fill="#00D9FF" opacity="0.7"/>
</svg>
