<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Crown overlay on TOP of head (not antenna, part of the face) -->
    <!-- Crown base -->
    <rect x="28" y="16" width="44" height="8" rx="1" fill="#1a1400" stroke="#00D9FF" stroke-width="1"/>
    <!-- Crown spikes (5) -->
    <polygon points="30,16 33,10 36,16" fill="#00D9FF" opacity="0.9"/>
    <polygon points="38,16 41,8 44,16" fill="#00D9FF" opacity="0.9"/>
    <polygon points="46,16 50,6 54,16" fill="#00D9FF" opacity="1"/>
    <polygon points="56,16 59,8 62,16" fill="#00D9FF" opacity="0.9"/>
    <polygon points="64,16 67,10 70,16" fill="#00D9FF" opacity="0.9"/>
    <!-- Crown gems -->
    <circle cx="33" cy="11" r="1.5" fill="#FFD700"/>
    <circle cx="50" cy="7" r="2" fill="#FFD700"/>
    <circle cx="67" cy="11" r="1.5" fill="#FFD700"/>
    <circle cx="41.5" cy="9" r="1.5" fill="#FF2D78"/>
    <circle cx="58.5" cy="9" r="1.5" fill="#FF2D78"/>

    <!-- Rect head (starts below crown) -->
    <rect x="22" y="22" width="56" height="54" rx="4" fill="#0C0C0A" stroke="#00D9FF" stroke-width="2"/>

    <!-- Display: gear symbol (cog wheel) -->
    <rect x="27" y="27" width="46" height="30" rx="2" fill="#060604" stroke="#00D9FF" stroke-width="1"/>
    <!-- Gear body (circle) -->
    <circle cx="50" cy="42" r="10" fill="#1a1a0e" stroke="#00D9FF" stroke-width="1.8"/>
    <!-- Gear center hole -->
    <circle cx="50" cy="42" r="4" fill="#060604" stroke="#00D9FF" stroke-width="1.2"/>
    <circle cx="50" cy="42" r="1.5" fill="#00D9FF" opacity="0.8"/>
    <!-- Gear teeth (8 teeth via rects rotated) -->
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(0,50,42)"/>
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(45,50,42)"/>
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(90,50,42)"/>
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(135,50,42)"/>
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(180,50,42)"/>
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(225,50,42)"/>
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(270,50,42)"/>
    <rect x="48" y="29" width="4" height="5" rx="1" fill="#00D9FF" opacity="0.85" transform="rotate(315,50,42)"/>

    <!-- Leader badge (prominent) -->
    <rect x="27" y="60" width="46" height="12" rx="3" fill="#00D9FF" opacity="0.2" stroke="#00D9FF" stroke-width="1.2"/>
    <text x="50" y="66" text-anchor="middle" fill="#00D9FF" font-size="4.5" font-family="monospace" font-weight="bold">TECH LEAD</text>
    <text x="50" y="70" text-anchor="middle" fill="#00D9FF" font-size="3.5" font-family="monospace" opacity="0.6">LEADING THE CODE</text>

    <!-- Side ports -->
    <rect x="16" y="36" width="6" height="5" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="0.8"/>
    <rect x="16" y="46" width="6" height="5" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="0.8"/>
    <rect x="78" y="36" width="6" height="5" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="0.8"/>
    <rect x="78" y="46" width="6" height="5" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="0.8"/>

    <!-- Bottom traces -->
    <path d="M32,76 V85 H42 V81" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.6"/>
    <circle cx="42" cy="81" r="1.2" fill="#00D9FF" opacity="0.7"/>
    <path d="M68,76 V83 H58 V79" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.6"/>
    <circle cx="58" cy="79" r="1.2" fill="#00D9FF" opacity="0.7"/>
  </svg>