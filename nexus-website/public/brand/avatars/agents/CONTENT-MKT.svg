<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1a1f3a"/>
    <stop offset="100%" stop-color="#030108"/>
  </radialGradient>
</defs>
<rect width="100" height="100" rx="18" fill="url(#bg)"/>
<path d="M20,41.6 Q8.799999999999999,50 20,58.4"
      fill="none" stroke="#A855F7" stroke-width="1.6" opacity="0.55" stroke-linecap="round"/>
  <path d="M20,35.6 Q0.7999999999999972,50 20,64.4"
      fill="none" stroke="#A855F7" stroke-width="1.4000000000000001" opacity="0.45000000000000007" stroke-linecap="round"/>
  
  <!-- megaphone bell -->
  <path d="M20,26.0 L55,40 L55,60 L20,74.0 Z"
        fill="#0f0a1f" stroke="#A855F7" stroke-width="2"/>
  <!-- body/barrel -->
  <rect x="55" y="40" width="23" height="20" rx="3"
        fill="#0f0a1f" stroke="#A855F7" stroke-width="1.5"/>
  <!-- speaker ring on body -->
  <circle cx="78" cy="50" r="5" fill="#0f0a1f" stroke="#A855F7" stroke-width="1.5"/>
  <circle cx="78" cy="50" r="2.5" fill="#A855F7" opacity="0.8"/>
  <circle cx="36" cy="50" r="8" fill="#0f0a1f" stroke="#A855F7" stroke-width="1.3"/>
  <!-- pencil body -->
  <rect x="32" y="45" width="4.5" height="12" rx="1" transform="rotate(-30,36,50)"
        fill="#A855F7" opacity="0.9"/>
  <!-- pencil tip -->
  <polygon points="36,57 34,61 38,61" transform="rotate(-30,36,59)" fill="#A855F7" opacity="0.75"/>
  <!-- pencil eraser -->
  <rect x="32" y="44" width="4.5" height="3" rx="0.5" transform="rotate(-30,36,45.5)"
        fill="#FFD700" opacity="0.85"/>
  <!-- writing line -->
  <line x1="37" y1="54" x2="42" y2="54" stroke="#A855F7" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
</svg>