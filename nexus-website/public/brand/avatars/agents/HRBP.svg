<!-- bridge-connection iris right -->
<circle cx="61" cy="47" r="8" fill="#100806" stroke="#d4a574" stroke-width="1.3"/>
<circle cx="57" cy="47" r="2" fill="#d4a574" opacity="0.85"/>
<circle cx="65" cy="47" r="2" fill="#d4a574" opacity="0.85"/>
