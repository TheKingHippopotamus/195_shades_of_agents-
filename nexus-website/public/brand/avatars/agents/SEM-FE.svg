<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Wave antenna (curved) -->
    <path d="M50,22 C50,14 44,12 50,8 C56,4 50,6 50,10" stroke="#00D9FF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="8" r="1.5" fill="#00D9FF"/>

    <!-- Wider rect head (senior/experienced look) -->
    <rect x="14" y="22" width="72" height="54" rx="5" fill="#080E1C" stroke="#00D9FF" stroke-width="2.2"/>

    <!-- Senior badge top -->
    <rect x="14" y="22" width="72" height="6" rx="3" fill="#00D9FF" opacity="0.15"/>
    <text x="50" y="27" text-anchor="middle" fill="#00D9FF" font-size="4" font-family="monospace" opacity="0.9">SENIOR ENGINEER</text>

    <!-- Display: Sine wave / signal wave -->
    <rect x="19" y="31" width="62" height="26" rx="2" fill="#040810" stroke="#00D9FF" stroke-width="1"/>
    <!-- Sine wave (large, prominent) -->
    <path d="M22,44 Q27,36 32,44 Q37,52 42,44 Q47,36 52,44 Q57,52 62,44 Q67,36 72,44 Q74,48 76,44" stroke="#00D9FF" stroke-width="2" fill="none"/>
    <!-- Second harmonic (smaller, offset) -->
    <path d="M22,46 Q29,41 36,46 Q43,51 50,46 Q57,41 64,46 Q71,51 78,46" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.4"/>
    <!-- Wave axis -->
    <line x1="22" y1="44" x2="78" y2="44" stroke="#00D9FF" stroke-width="0.4" opacity="0.3" stroke-dasharray="2 2"/>

    <!-- Oscilloscope grid lines -->
    <line x1="37" y1="31" x2="37" y2="57" stroke="#00D9FF" stroke-width="0.3" opacity="0.25"/>
    <line x1="52" y1="31" x2="52" y2="57" stroke="#00D9FF" stroke-width="0.3" opacity="0.25"/>
    <line x1="67" y1="31" x2="67" y2="57" stroke="#00D9FF" stroke-width="0.3" opacity="0.25"/>
    <line x1="19" y1="40" x2="81" y2="40" stroke="#00D9FF" stroke-width="0.3" opacity="0.25"/>
    <line x1="19" y1="48" x2="81" y2="48" stroke="#00D9FF" stroke-width="0.3" opacity="0.25"/>

    <!-- Bottom PCB traces -->
    <path d="M25,60 V68 H35 V64" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.6"/>
    <circle cx="35" cy="64" r="1.2" fill="#00D9FF" opacity="0.7"/>
    <path d="M50,60 V72 H60 V68" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.6"/>
    <circle cx="60" cy="68" r="1.2" fill="#00D9FF" opacity="0.7"/>
    <path d="M75,60 V66 H65" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- Side ports (wider body has more) -->
    <rect x="8" y="36" width="6" height="4" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="1"/>
    <rect x="8" y="44" width="6" height="4" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="1"/>
    <rect x="86" y="36" width="6" height="4" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="1"/>
    <rect x="86" y="44" width="6" height="4" rx="1" fill="#030108" stroke="#00D9FF" stroke-width="1"/>
  </svg>