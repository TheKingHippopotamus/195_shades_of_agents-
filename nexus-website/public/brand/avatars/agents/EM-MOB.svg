<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Antenna with mobile signal arc -->
    <line x1="50" y1="22" x2="50" y2="12" stroke="#FF2D78" stroke-width="1.5"/>
    <path d="M46,15 Q50,11 54,15" stroke="#FF2D78" stroke-width="1.2" fill="none"/>
    <path d="M43,18 Q50,12 57,18" stroke="#FF2D78" stroke-width="0.9" fill="none" opacity="0.6"/>

    <!-- Rect head -->
    <rect x="22" y="22" width="56" height="54" rx="4" fill="#0D060E" stroke="#00D9FF" stroke-width="2"/>

    <!-- Display: team nodes + phone icon -->
    <rect x="27" y="27" width="46" height="32" rx="2" fill="#070309" stroke="#FF2D78" stroke-width="1"/>
    <!-- Phone icon center top -->
    <rect x="44" y="30" width="12" height="16" rx="2" fill="none" stroke="#FF2D78" stroke-width="1.5"/>
    <rect x="46" y="32.5" width="8" height="9" rx="1" fill="#1a0812" stroke="#00D9FF" stroke-width="0.5"/>
    <circle cx="50" cy="44" r="1" fill="#FF2D78" opacity="0.8"/>
    <!-- Team member nodes below phone -->
    <line x1="44" y1="46" x2="36" y2="52" stroke="#00D9FF" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="46" x2="50" y2="52" stroke="#00D9FF" stroke-width="1" opacity="0.7"/>
    <line x1="56" y1="46" x2="64" y2="52" stroke="#00D9FF" stroke-width="1" opacity="0.7"/>
    <circle cx="36" cy="55" r="4" fill="#1a0610" stroke="#00D9FF" stroke-width="1.2"/>
    <text x="36" y="57" text-anchor="middle" fill="#00D9FF" font-size="3.5" font-family="monospace">MOB</text>
    <circle cx="50" cy="55" r="4" fill="#1a0610" stroke="#00D9FF" stroke-width="1.2"/>
    <text x="50" y="57" text-anchor="middle" fill="#00D9FF" font-size="3.5" font-family="monospace">MOB</text>
    <circle cx="64" cy="55" r="4" fill="#1a0610" stroke="#00D9FF" stroke-width="1.2"/>
    <text x="64" y="57" text-anchor="middle" fill="#00D9FF" font-size="3.5" font-family="monospace">MOB</text>

    <!-- Label -->
    <rect x="29" y="62" width="42" height="7" rx="2" fill="#FF2D78" opacity="0.12" stroke="#FF2D78" stroke-width="0.8"/>
    <text x="50" y="67.5" text-anchor="middle" fill="#FF2D78" font-size="4.5" font-family="monospace">EM · MOBILE</text>

    <!-- Side traces -->
    <path d="M22,44 H14 V50 H18" stroke="#FF2D78" stroke-width="0.8" fill="none" opacity="0.6"/>
    <circle cx="18" cy="50" r="1.2" fill="#FF2D78" opacity="0.7"/>
    <path d="M78,44 H86 V50 H82" stroke="#FF2D78" stroke-width="0.8" fill="none" opacity="0.6"/>
    <circle cx="82" cy="50" r="1.2" fill="#FF2D78" opacity="0.7"/>
  </svg>