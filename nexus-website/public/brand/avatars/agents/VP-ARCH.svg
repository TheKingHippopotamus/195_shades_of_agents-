<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Single antenna with circle -->
    <line x1="50" y1="20" x2="50" y2="9" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="50" cy="8" r="2" fill="none" stroke="#00D9FF" stroke-width="1.5"/>

    <!-- Rect head with blueprint aesthetics -->
    <rect x="20" y="20" width="60" height="56" rx="4" fill="#080D1C" stroke="#00D9FF" stroke-width="2"/>

    <!-- Blueprint parallel horizontal lines -->
    <line x1="24" y1="28" x2="76" y2="28" stroke="#00D9FF" stroke-width="0.5" opacity="0.4"/>
    <line x1="24" y1="34" x2="76" y2="34" stroke="#00D9FF" stroke-width="0.5" opacity="0.4"/>
    <line x1="24" y1="40" x2="76" y2="40" stroke="#00D9FF" stroke-width="0.5" opacity="0.4"/>
    <line x1="24" y1="46" x2="76" y2="46" stroke="#00D9FF" stroke-width="0.5" opacity="0.4"/>
    <!-- Blueprint diagonal lines -->
    <line x1="20" y1="20" x2="80" y2="76" stroke="#00D9FF" stroke-width="0.4" opacity="0.25"/>
    <line x1="80" y1="20" x2="20" y2="76" stroke="#00D9FF" stroke-width="0.4" opacity="0.25"/>
    <!-- Blueprint dot grid -->
    <circle cx="30" cy="30" r="0.8" fill="#00D9FF" opacity="0.5"/>
    <circle cx="40" cy="30" r="0.8" fill="#00D9FF" opacity="0.5"/>
    <circle cx="60" cy="30" r="0.8" fill="#00D9FF" opacity="0.5"/>
    <circle cx="70" cy="30" r="0.8" fill="#00D9FF" opacity="0.5"/>
    <circle cx="30" cy="42" r="0.8" fill="#00D9FF" opacity="0.5"/>
    <circle cx="70" cy="42" r="0.8" fill="#00D9FF" opacity="0.5"/>

    <!-- Display screen with compass/triangle tool -->
    <rect x="26" y="48" width="48" height="24" rx="2" fill="#040A15" stroke="#00D9FF" stroke-width="1"/>
    <!-- Triangle (drafting tool) -->
    <polygon points="50,52 38,70 62,70" fill="none" stroke="#00D9FF" stroke-width="1.8"/>
    <!-- Compass needle through triangle -->
    <line x1="50" y1="52" x2="50" y2="70" stroke="#00D9FF" stroke-width="0.8" opacity="0.6"/>
    <!-- Compass circle -->
    <circle cx="50" cy="60" r="4" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.7"/>
    <circle cx="50" cy="60" r="1" fill="#00D9FF" opacity="0.9"/>
    <!-- Compass cardinal marks -->
    <line x1="50" y1="55" x2="50" y2="54" stroke="#00D9FF" stroke-width="1"/>
    <line x1="55" y1="60" x2="56" y2="60" stroke="#00D9FF" stroke-width="1"/>
    <line x1="50" y1="65" x2="50" y2="66" stroke="#00D9FF" stroke-width="1"/>
    <line x1="45" y1="60" x2="44" y2="60" stroke="#00D9FF" stroke-width="1"/>

    <!-- ARCH label -->
    <text x="50" y="78" text-anchor="middle" fill="#00D9FF" font-size="4" font-family="monospace" opacity="0.7">ARCHITECT</text>

    <!-- Corner drafting angle marks -->
    <path d="M24,20 H30 V26" stroke="#00D9FF" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M76,20 H70 V26" stroke="#00D9FF" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M24,76 H30 V70" stroke="#00D9FF" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M76,76 H70 V70" stroke="#00D9FF" stroke-width="1" fill="none" opacity="0.7"/>
  </svg>