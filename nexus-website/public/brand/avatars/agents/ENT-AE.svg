  <rect x="52" y="53" width="3" height="3" rx="0.5" fill="#0d0800"/>
  <!-- door -->
  <rect x="48.5" y="54" width="3" height="4" rx="0.5" fill="#0d0800" opacity="0.7"/>
  <line x1="68.7" y1="53.3" x2="83.5" y2="55.9" stroke="#F97316" stroke-width="1.4" opacity="0.7"/>
<polygon points="79.2,57.2 79.9,53.2 83.5,55.9" fill="#F97316" opacity="0.7"/>
