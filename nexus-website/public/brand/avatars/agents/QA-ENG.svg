    </defs>
    <!-- Shield -->
    <path d="M50,16 L68,23 L68,49 Q68,63 50,75 Q32,63 32,49 L32,23 Z" fill="url(#qe-sg)" stroke="#22C55E" stroke-width="1.5"/>
