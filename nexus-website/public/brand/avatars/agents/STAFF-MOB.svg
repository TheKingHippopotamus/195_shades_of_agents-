<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Mobile+signal antenna -->
    <line x1="50" y1="22" x2="50" y2="11" stroke="#FF2D78" stroke-width="1.5"/>
    <path d="M46,14 Q50,10 54,14" stroke="#FF2D78" stroke-width="1.2" fill="none"/>

    <!-- Rect head -->
    <rect x="22" y="22" width="56" height="54" rx="4" fill="#0D060E" stroke="#00D9FF" stroke-width="2"/>

    <!-- Display: cross-platform (phone + desktop overlapping) -->
    <rect x="27" y="27" width="46" height="34" rx="2" fill="#07030A" stroke="#00D9FF" stroke-width="1"/>
    <!-- Desktop/monitor (back, larger) -->
    <rect x="30" y="30" width="32" height="22" rx="2" fill="#140820" stroke="#00D9FF" stroke-width="1.2"/>
    <rect x="31" y="31.5" width="30" height="16" rx="1" fill="#1F0D30" stroke="#FF2D78" stroke-width="0.5"/>
    <!-- Desktop stand -->
    <rect x="41" y="52" width="10" height="3" rx="1" fill="#00D9FF" opacity="0.5"/>
    <rect x="38" y="55" width="16" height="1.5" rx="0.75" fill="#00D9FF" opacity="0.5"/>
    <!-- Phone (overlapping, front-right) -->
    <rect x="50" y="35" width="18" height="26" rx="3" fill="#1a0818" stroke="#FF2D78" stroke-width="1.5"/>
    <rect x="52" y="38" width="14" height="17" rx="1" fill="#2a0A25" stroke="#00D9FF" stroke-width="0.5"/>
    <!-- Phone home button -->
    <circle cx="59" cy="58" r="1.5" fill="#FF2D78" opacity="0.8"/>
    <!-- Cross-platform arrow -->
    <path d="M45,42 L50,42" stroke="#00D9FF" stroke-width="1" stroke-dasharray="2 1"/>
    <polygon points="50,42 48,40.5 48,43.5" fill="#00D9FF" opacity="0.7"/>

    <!-- Desktop screen content (app mockup) -->
    <rect x="33" y="33" width="14" height="2" rx="0.5" fill="#00D9FF" opacity="0.4"/>
    <rect x="33" y="36.5" width="10" height="1.5" rx="0.5" fill="#FF2D78" opacity="0.3"/>
    <rect x="33" y="39.5" width="12" height="1.5" rx="0.5" fill="#00D9FF" opacity="0.3"/>
    <rect x="33" y="42.5" width="8" height="1.5" rx="0.5" fill="#FF2D78" opacity="0.3"/>

    <!-- Label -->
    <rect x="27" y="64" width="46" height="8" rx="2" fill="#FF2D78" opacity="0.12" stroke="#FF2D78" stroke-width="0.8"/>
    <text x="50" y="69.5" text-anchor="middle" fill="#FF2D78" font-size="4" font-family="monospace">STAFF · MOBILE</text>

    <!-- Bottom traces -->
    <path d="M34,75 V82 H42" stroke="#FF2D78" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="42" cy="82" r="1.2" fill="#FF2D78" opacity="0.7"/>
    <path d="M66,75 V80 H58" stroke="#FF2D78" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="58" cy="80" r="1.2" fill="#FF2D78" opacity="0.7"/>
  </svg>