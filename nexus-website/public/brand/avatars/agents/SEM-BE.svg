    <text x="39" y="57.5" text-anchor="middle" fill="#00D9FF" font-size="3.5" font-family="monospace" opacity="0.7">STANDBY</text>

    <!-- Dense PCB traces (many paths) -->
    <path d="M16,32 H8 V36 H12" stroke="#00D9FF" stroke-width="0.7" fill="none" opacity="0.6"/>
