<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Antenna with data dot -->
    <line x1="50" y1="22" x2="50" y2="10" stroke="#FF6B35" stroke-width="1.5"/>
    <rect x="47" y="8" width="6" height="3" rx="1" fill="#00D9FF" stroke="#FF6B35" stroke-width="0.8"/>

    <!-- Rect head -->
    <rect x="21" y="22" width="58" height="54" rx="4" fill="#0D0806" stroke="#00D9FF" stroke-width="2"/>

    <!-- Display screen: scatter plot / data chart -->
    <rect x="26" y="26" width="48" height="32" rx="2" fill="#070401" stroke="#FF6B35" stroke-width="1"/>
    <!-- Chart axes -->
    <line x1="33" y1="28" x2="33" y2="54" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
    <line x1="33" y1="54" x2="70" y2="54" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
    <!-- Data points (scatter plot — 8 dots in chart pattern) -->
    <circle cx="38" cy="50" r="2" fill="#FF6B35" opacity="0.9"/>
    <circle cx="42" cy="44" r="2.2" fill="#00D9FF" opacity="0.8"/>
    <circle cx="46" cy="48" r="1.8" fill="#FF6B35" opacity="0.8"/>
    <circle cx="50" cy="38" r="2.5" fill="#00D9FF" opacity="0.9"/>
    <circle cx="54" cy="42" r="2" fill="#FF6B35" opacity="0.7"/>
    <circle cx="58" cy="34" r="2.2" fill="#00D9FF" opacity="0.9"/>
    <circle cx="62" cy="40" r="1.8" fill="#FF6B35" opacity="0.8"/>
    <circle cx="66" cy="32" r="2" fill="#00D9FF" opacity="0.8"/>
    <!-- Trend line through scatter -->
    <line x1="36" y1="52" x2="68" y2="31" stroke="#FF6B35" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>

    <!-- Bottom bar chart mini -->
    <rect x="28" y="62" width="44" height="10" rx="2" fill="#070401" stroke="#00D9FF" stroke-width="0.7"/>
    <rect x="31" y="65" width="4" height="5" rx="1" fill="#FF6B35" opacity="0.8"/>
    <rect x="37" y="63" width="4" height="7" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="43" y="65" width="4" height="5" rx="1" fill="#FF6B35" opacity="0.6"/>
    <rect x="49" y="62.5" width="4" height="7.5" rx="1" fill="#00D9FF" opacity="0.8"/>
    <rect x="55" y="64" width="4" height="6" rx="1" fill="#FF6B35" opacity="0.7"/>
    <rect x="61" y="63" width="4" height="7" rx="1" fill="#00D9FF" opacity="0.9"/>

    <!-- Side ports -->
    <rect x="15" y="42" width="6" height="4" rx="1" fill="#030108" stroke="#FF6B35" stroke-width="0.8"/>
    <rect x="79" y="42" width="6" height="4" rx="1" fill="#030108" stroke="#FF6B35" stroke-width="0.8"/>
  </svg>