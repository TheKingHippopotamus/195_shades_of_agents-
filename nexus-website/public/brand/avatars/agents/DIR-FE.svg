<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Antenna -->
    <line x1="50" y1="22" x2="50" y2="10" stroke="#00FF88" stroke-width="1.5"/>
    <polygon points="50,8 54,13 46,13" fill="#00FF88"/>

    <!-- Rect head -->
    <rect x="21" y="22" width="58" height="54" rx="4" fill="#071410" stroke="#00D9FF" stroke-width="2"/>
    <!-- Green accent border on left -->
    <rect x="21" y="22" width="3" height="54" rx="2" fill="#00FF88" opacity="0.5"/>

    <!-- Display screen with </> code brackets -->
    <rect x="26" y="26" width="48" height="30" rx="2" fill="#030D08" stroke="#00FF88" stroke-width="1"/>
    <!-- < bracket -->
    <path d="M35,34 L29,41 L35,48" stroke="#00D9FF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- / slash -->
    <line x1="47" y1="32" x2="42" y2="50" stroke="#00FF88" stroke-width="2" stroke-linecap="round"/>
    <!-- > bracket -->
    <path d="M50,34 L56,41 L50,48" stroke="#00D9FF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cursor blink rect -->
    <rect x="58" y="40" width="5" height="7" rx="1" fill="#00FF88" opacity="0.8"/>

    <!-- Frontend wave pattern traces (bottom section) -->
    <path d="M26,62 Q33,57 40,62 Q47,67 54,62 Q61,57 68,62 Q72,65 74,62" stroke="#00D9FF" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M26,68 Q34,64 42,68 Q50,72 58,68 Q66,64 74,68" stroke="#00FF88" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Port indicators -->
    <rect x="16" y="35" width="5" height="4" rx="1" fill="#00D9FF" opacity="0.6"/>
    <rect x="79" y="35" width="5" height="4" rx="1" fill="#00FF88" opacity="0.6"/>

    <!-- Layer badge -->
    <rect x="26" y="72" width="48" height="4" rx="1" fill="#00FF88" opacity="0.15"/>
    <text x="50" y="75.5" text-anchor="middle" fill="#00FF88" font-size="3.5" font-family="monospace">HTML · CSS · JS</text>
  </svg>