<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1a1f3a"/>
    <stop offset="100%" stop-color="#030108"/>
  </radialGradient>
</defs>
<rect width="100" height="100" rx="18" fill="url(#bg)"/>
<!-- ambient ring -->
  <circle cx="50" cy="50" r="35" fill="rgba(249,115,22,0.07)" stroke="#F97316" stroke-width="0.4" opacity="0.35"/>
  <!-- U arch body -->
  <path d="M34,26 L34,56 Q34,76 50,76 Q66,76 66,56 L66,26"
        stroke="#F97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- N cap -->
  <rect x="27" y="21" width="14" height="9" rx="2.5" fill="#F97316"/>
  <text x="34" y="28.5" text-anchor="middle" fill="#0d0800"
        font-size="5.5" font-weight="bold" font-family="monospace">N</text>
  <!-- S cap -->
  <rect x="59" y="21" width="14" height="9" rx="2.5" fill="#F97316"/>
  <text x="66" y="28.5" text-anchor="middle" fill="#0d0800"
        font-size="5.5" font-weight="bold" font-family="monospace">S</text>
  <circle cx="50" cy="50" r="13" fill="#0d0800" stroke="#F97316" stroke-width="1.5"/>
  <!-- key ring -->
  <circle cx="47" cy="48" r="4.5" fill="none" stroke="#F97316" stroke-width="2"/>
  <!-- key blade -->
  <line x1="51" y1="49" x2="60" y2="55" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- key teeth -->
  <line x1="55" y1="52.2" x2="55" y2="55.2" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="58" y1="54" x2="58" y2="57" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="67.0" y1="50.0" x2="80.0" y2="50.0" stroke="#F97316" stroke-width="1.4" opacity="0.6"/>
<polygon points="76.0,52.0 76.0,48.0 80.0,50.0" fill="#F97316" opacity="0.6"/>
<line x1="50.0" y1="67.0" x2="50.0" y2="80.0" stroke="#F97316" stroke-width="1.4" opacity="0.6"/>
<polygon points="48.0,76.0 52.0,76.0 50.0,80.0" fill="#F97316" opacity="0.6"/>
<line x1="33.0" y1="50.0" x2="20.0" y2="50.0" stroke="#F97316" stroke-width="1.4" opacity="0.6"/>
<polygon points="24.0,48.0 24.0,52.0 20.0,50.0" fill="#F97316" opacity="0.6"/>
<line x1="50.0" y1="33.0" x2="50.0" y2="20.0" stroke="#F97316" stroke-width="1.4" opacity="0.6"/>
<polygon points="52.0,24.0 48.0,24.0 50.0,20.0" fill="#F97316" opacity="0.6"/>
</svg>