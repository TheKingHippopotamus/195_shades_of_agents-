<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Dual antenna (backend) -->
    <line x1="46" y1="22" x2="46" y2="11" stroke="#00D9FF" stroke-width="1.5"/>
    <line x1="54" y1="22" x2="54" y2="11" stroke="#00D9FF" stroke-width="1.5"/>
    <rect x="43" y="9" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.8"/>
    <rect x="51" y="9" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.8"/>

    <!-- Rect head -->
    <rect x="22" y="22" width="56" height="54" rx="4" fill="#08100E" stroke="#00D9FF" stroke-width="2"/>

    <!-- Display: team nodes + server -->
    <rect x="27" y="27" width="46" height="32" rx="2" fill="#040D09" stroke="#00D9FF" stroke-width="1"/>
    <!-- Server icon (top) -->
    <rect x="39" y="30" width="22" height="5" rx="1" fill="#112" stroke="#00D9FF" stroke-width="0.8"/>
    <circle cx="56" cy="32.5" r="1.2" fill="#22C55E"/>
    <rect x="41" y="31.5" width="10" height="2" rx="0.5" fill="#00D9FF" opacity="0.4"/>
    <!-- Team connection lines from server -->
    <line x1="44" y1="35" x2="36" y2="43" stroke="#00D9FF" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="35" x2="50" y2="43" stroke="#00D9FF" stroke-width="1" opacity="0.7"/>
    <line x1="56" y1="35" x2="64" y2="43" stroke="#00D9FF" stroke-width="1" opacity="0.7"/>
    <!-- Cross connections (multiple connection lines) -->
    <line x1="36" y1="47" x2="50" y2="47" stroke="#00D9FF" stroke-width="0.6" opacity="0.4" stroke-dasharray="2 1"/>
    <line x1="50" y1="47" x2="64" y2="47" stroke="#00D9FF" stroke-width="0.6" opacity="0.4" stroke-dasharray="2 1"/>
    <!-- Team nodes (BE) -->
    <circle cx="36" cy="47" r="4" fill="#0D1F18" stroke="#00D9FF" stroke-width="1.2"/>
    <text x="36" y="49" text-anchor="middle" fill="#00D9FF" font-size="4" font-family="monospace">BE</text>
    <circle cx="50" cy="47" r="4" fill="#0D1F18" stroke="#00D9FF" stroke-width="1.2"/>
    <text x="50" y="49" text-anchor="middle" fill="#00D9FF" font-size="4" font-family="monospace">BE</text>
    <circle cx="64" cy="47" r="4" fill="#0D1F18" stroke="#00D9FF" stroke-width="1.2"/>
    <text x="64" y="49" text-anchor="middle" fill="#00D9FF" font-size="4" font-family="monospace">BE</text>
    <!-- DB dot at bottom of display -->
    <ellipse cx="50" cy="57" rx="8" ry="2.5" fill="none" stroke="#00D9FF" stroke-width="0.8" opacity="0.6"/>

    <!-- EM-BE label -->
    <rect x="29" y="62" width="42" height="7" rx="2" fill="#00D9FF" opacity="0.12" stroke="#00D9FF" stroke-width="0.8"/>
    <text x="50" y="67.5" text-anchor="middle" fill="#00D9FF" font-size="4.5" font-family="monospace">EM · BACKEND</text>

    <!-- Bottom traces -->
    <path d="M33,76 V85 H45 V81" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M67,76 V83 H55 V79" stroke="#00D9FF" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="45" cy="81" r="1.2" fill="#00D9FF" opacity="0.7"/>
    <circle cx="55" cy="79" r="1.2" fill="#00D9FF" opacity="0.7"/>
  </svg>