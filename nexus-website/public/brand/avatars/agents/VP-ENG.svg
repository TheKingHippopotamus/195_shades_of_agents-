<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <!-- Single straight antenna -->
    <line x1="50" y1="20" x2="50" y2="8" stroke="#00D9FF" stroke-width="1.8"/>
    <circle cx="50" cy="7" r="2.5" fill="#00D9FF"/>
    <circle cx="50" cy="7" r="1" fill="#030108"/>

    <!-- Clean rect head -->
    <rect x="22" y="20" width="56" height="54" rx="5" fill="#080E1E" stroke="#00D9FF" stroke-width="2"/>

    <!-- Single large chip center -->
    <rect x="30" y="28" width="40" height="28" rx="3" fill="#0F1F35" stroke="#00D9FF" stroke-width="1.5"/>
    <!-- chip pins left -->
    <rect x="24" y="32" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="24" y="38" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="24" y="44" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.7"/>
    <!-- chip pins right -->
    <rect x="70" y="32" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="70" y="38" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="70" y="44" width="6" height="3" rx="1" fill="#00D9FF" opacity="0.7"/>
    <!-- chip pins top -->
    <rect x="36" y="22" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="43" y="22" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="50" y="22" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="57" y="22" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <!-- chip pins bottom -->
    <rect x="36" y="56" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="43" y="56" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="50" y="56" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <rect x="57" y="56" width="3" height="6" rx="1" fill="#00D9FF" opacity="0.7"/>
    <!-- VP text inside chip -->
    <text x="50" y="45" text-anchor="middle" fill="#00D9FF" font-size="10" font-weight="bold" font-family="monospace" opacity="0.9">VP</text>

    <!-- VP badge corner (top-right) -->
    <rect x="65" y="22" width="11" height="7" rx="2" fill="#00D9FF"/>
    <text x="70.5" y="27.5" text-anchor="middle" fill="#030108" font-size="4.5" font-weight="bold" font-family="monospace">VP</text>

    <!-- 2 side ports (minimal) -->
    <rect x="16" y="48" width="6" height="8" rx="2" fill="#0F1F35" stroke="#00D9FF" stroke-width="1"/>
    <rect x="78" y="48" width="6" height="8" rx="2" fill="#0F1F35" stroke="#00D9FF" stroke-width="1"/>
    <line x1="19" y1="52" x2="22" y2="52" stroke="#00D9FF" stroke-width="0.8"/>
    <line x1="78" y1="52" x2="81" y2="52" stroke="#00D9FF" stroke-width="0.8"/>

    <!-- Status bar bottom -->
    <rect x="28" y="62" width="44" height="7" rx="2" fill="#0F1F35" stroke="#00D9FF" stroke-width="0.7"/>
    <rect x="30" y="63.5" width="28" height="4" rx="1.5" fill="#00D9FF" opacity="0.6"/>
    <circle cx="68" cy="65.5" r="2" fill="#22C55E" opacity="0.9"/>
  </svg>