<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">

  
  <defs>
    <filter id="soc" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="secbg-soc" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#060000"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#secbg-soc)" rx="8"/>
  <g filter="url(#soc)">
    
  <!-- Cloak body -->
  <path d="M28,42 L20,95 L80,95 L72,42 Z"
        fill="#0d0000" stroke="#B91C1C" stroke-width="0.5"/>
  <!-- Inner cloak shadow -->
  <path d="M36,44 L32,95 L68,95 L64,44 Z"
        fill="#050000" opacity="0.7"/>
  <!-- Neck -->
  <rect x="45" y="36" width="10" height="8" fill="#080000"/>
  <!-- Hood outer -->
  <ellipse cx="50" cy="31" rx="11.700000000000001" ry="9.9" fill="#0d0000" stroke="#B91C1C" stroke-width="0.6"/>
  <!-- Hood inner shadow -->
  <ellipse cx="50" cy="33" rx="7.6499999999999995" ry="6.3" fill="#020000"/>
  <!-- Visor glow -->
  <ellipse cx="50" cy="31.9" rx="4.95" ry="1.98" fill="#EF4444" opacity="0.9"/>
  <ellipse cx="50" cy="31.9" rx="4.95" ry="1.98" fill="none" stroke="#EF4444" stroke-width="0.5" opacity="0.5"/>
  <!-- Chest area -->
  
    <!-- Radar circles -->
    <circle cx="50" cy="62" r="2" fill="#EF4444" opacity="0.8"/>
    <circle cx="50" cy="62" r="4.5" fill="none" stroke="#EF4444" stroke-width="0.6" opacity="0.6"/>
    <circle cx="50" cy="62" r="7" fill="none" stroke="#EF4444" stroke-width="0.5" opacity="0.4"/>
    <!-- Radar sweep -->
    <line x1="50" y1="62" x2="56" y2="56" stroke="#EF4444" stroke-width="0.8" opacity="0.7"/>
    <!-- Radar blip -->
    <circle cx="54" cy="57" r="1" fill="#FCA5A5" opacity="0.9"/>
  <!-- Tool -->
  
    <!-- Eye surveillance tool -->
    <ellipse cx="76" cy="60" rx="7" ry="4" fill="none" stroke="#EF4444" stroke-width="0.8"/>
    <circle cx="76" cy="60" r="2.5" fill="#B91C1C" opacity="0.6"/>
    <circle cx="76" cy="60" r="1.2" fill="#EF4444" opacity="0.9"/>
    <line x1="76" y1="64" x2="76" y2="85" stroke="#B91C1C" stroke-width="0.9"/>
  <!-- Extras -->
  
  </g>
  <rect x="22" y="4" width="56" height="8" rx="2" fill="#1a0000" stroke="#EF4444" stroke-width="0.7"/>
  <text x="50" y="9.8" font-family="monospace" font-size="4" fill="#EF4444" text-anchor="middle" letter-spacing="0.2">SOC ANALYST</text>
</svg>