<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1a1f3a"/>
    <stop offset="100%" stop-color="#030108"/>
  </radialGradient>
</defs>
<rect width="100" height="100" rx="18" fill="url(#bg)"/>
<!-- ambient ring -->
  <circle cx="50" cy="50" r="36" fill="rgba(249,115,22,0.07)" stroke="#F97316" stroke-width="0.4" opacity="0.35"/>
  <!-- U arch body -->
  <path d="M34,26 L34,56 Q34,76 50,76 Q66,76 66,56 L66,26"
        stroke="#F97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- N cap -->
  <rect x="27" y="21" width="14" height="9" rx="2.5" fill="#F97316"/>
  <text x="34" y="28.5" text-anchor="middle" fill="#0d0800"
        font-size="5.5" font-weight="bold" font-family="monospace">N</text>
  <!-- S cap -->
  <rect x="59" y="21" width="14" height="9" rx="2.5" fill="#F97316"/>
  <text x="66" y="28.5" text-anchor="middle" fill="#0d0800"
        font-size="5.5" font-weight="bold" font-family="monospace">S</text>
  <circle cx="50" cy="50" r="14" fill="#0d0800" stroke="#F97316" stroke-width="1.5"/>
  <!-- gear outer ring -->
  <circle cx="50" cy="50" r="9" fill="none" stroke="#F97316" stroke-width="2" opacity="0.5" stroke-dasharray="4 2"/>
  <!-- gear teeth via small rects around circumference -->
  <circle cx="59.0" cy="50.0" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="56.4" cy="56.4" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="50.0" cy="59.0" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="43.6" cy="56.4" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="41.0" cy="50.0" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="43.6" cy="43.6" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="50.0" cy="41.0" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="56.4" cy="43.6" r="1.8" fill="#F97316" opacity="0.85"/>
  <!-- inner hub -->
  <circle cx="50" cy="50" r="5" fill="#0d0800"/>
  <!-- dollar sign -->
  <text x="50" y="53.5" text-anchor="middle" fill="#F97316"
        font-size="7.5" font-weight="bold" font-family="monospace">$</text>
  <line x1="66.7" y1="56.7" x2="79.7" y2="62.0" stroke="#F97316" stroke-width="1.4" opacity="0.65"/>
<polygon points="75.2,62.3 76.7,58.6 79.7,62.0" fill="#F97316" opacity="0.65"/>
<line x1="43.3" y1="66.7" x2="38.0" y2="79.7" stroke="#F97316" stroke-width="1.4" opacity="0.65"/>
<polygon points="37.7,75.2 41.4,76.7 38.0,79.7" fill="#F97316" opacity="0.65"/>
<line x1="33.3" y1="43.3" x2="20.3" y2="38.0" stroke="#F97316" stroke-width="1.4" opacity="0.65"/>
<polygon points="24.8,37.7 23.3,41.4 20.3,38.0" fill="#F97316" opacity="0.65"/>
<line x1="56.7" y1="33.3" x2="62.0" y2="20.3" stroke="#F97316" stroke-width="1.4" opacity="0.65"/>
<polygon points="62.3,24.8 58.6,23.3 62.0,20.3" fill="#F97316" opacity="0.65"/>
</svg>