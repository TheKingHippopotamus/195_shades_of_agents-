<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200"><defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1f3a"/><stop offset="100%" stop-color="#030108"/></radialGradient></defs><rect width="100" height="100" rx="18" fill="url(#bg)"/>
    <defs>
      <linearGradient id="qa-auto-sg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4ADE80"/>
        <stop offset="100%" stop-color="#14532D"/>
      </linearGradient>
    </defs>
    <!-- "AUTO" tag upper right -->
    <rect x="65" y="8" width="22" height="9" rx="3" fill="#052e16" stroke="#22C55E" stroke-width="0.9"/>
    <text x="76" y="14.5" font-family="monospace" font-size="5" fill="#4ADE80" text-anchor="middle" font-weight="bold">AUTO</text>
    <!-- Shield -->
