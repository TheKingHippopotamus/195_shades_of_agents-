  <rect x="30.5" y="49.5" width="8" height="1.2" rx="0.3" fill="#A855F7" opacity="0.6"/>
  <rect x="30.5" y="51.5" width="10" height="1.2" rx="0.3" fill="#A855F7" opacity="0.5"/>
  <rect x="30.5" y="53.5" width="7" height="1.2" rx="0.3" fill="#A855F7" opacity="0.4"/>
