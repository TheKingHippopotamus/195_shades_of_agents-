<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">

  
  <defs>
    <filter id="appsec" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="secbg-appsec" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#060000"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#secbg-appsec)" rx="8"/>
  <g filter="url(#appsec)">
    
  <!-- Cloak body -->
  <path d="M28,42 L20,95 L80,95 L72,42 Z"
        fill="#0d0000" stroke="#B91C1C" stroke-width="0.5"/>
  <!-- Inner cloak shadow -->
  <path d="M36,44 L32,95 L68,95 L64,44 Z"
        fill="#050000" opacity="0.7"/>
  <!-- Neck -->
  <rect x="45" y="36" width="10" height="8" fill="#080000"/>
  <!-- Hood outer -->
  <ellipse cx="50" cy="31" rx="11.700000000000001" ry="9.9" fill="#0d0000" stroke="#B91C1C" stroke-width="0.6"/>
  <!-- Hood inner shadow -->
  <ellipse cx="50" cy="33" rx="7.6499999999999995" ry="6.3" fill="#020000"/>
  <!-- Visor glow -->
  <ellipse cx="50" cy="31.9" rx="4.95" ry="1.98" fill="#EF4444" opacity="0.9"/>
  <ellipse cx="50" cy="31.9" rx="4.95" ry="1.98" fill="none" stroke="#EF4444" stroke-width="0.5" opacity="0.5"/>
  <!-- Chest area -->
  
    <!-- Code brackets -->
    <text x="50" y="65" font-family="monospace" font-size="9" fill="#EF4444" text-anchor="middle" opacity="0.85" font-weight="bold">&lt;/&gt;</text>
  <!-- Tool -->
  
    <!-- Exploit USB/key tool -->
    <rect x="70" y="55" width="14" height="5" rx="1" fill="#1a0000" stroke="#EF4444" stroke-width="0.8"/>
    <rect x="72" y="53" width="2" height="3" fill="#EF4444" opacity="0.7" rx="0.3"/>
    <rect x="75" y="53" width="2" height="4" fill="#EF4444" opacity="0.7" rx="0.3"/>
    <rect x="78" y="53" width="2" height="2.5" fill="#EF4444" opacity="0.7" rx="0.3"/>
    <line x1="77" y1="60" x2="80" y2="84" stroke="#B91C1C" stroke-width="0.9"/>
  <!-- Extras -->
  
  </g>
  <rect x="31" y="4" width="38" height="8" rx="2" fill="#1a0000" stroke="#EF4444" stroke-width="0.7"/>
  <text x="50" y="9.8" font-family="monospace" font-size="4.5" fill="#EF4444" text-anchor="middle">APPSEC</text>
</svg>