<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img">
  <title>Tier 4 — Staff+</title>
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <!-- Inner circle -->
  <circle cx="40" cy="40" r="24" fill="none" stroke="#10B981" stroke-width="1" opacity="0.35"/>
  <!-- 4-pointed star (staff+) -->
  <!-- 4-star: points at N,E,S,W with narrow inner radius -->
  <polygon points="40,10 43.5,36.5 70,40 43.5,43.5 40,70 36.5,43.5 10,40 36.5,36.5"
           fill="#10B981" opacity="0.25" stroke="#10B981" stroke-width="2"/>
  <!-- Center circle -->
  <circle cx="40" cy="40" r="5" fill="#10B981"/>
  <!-- Vertex dots at 4 points -->
  <circle cx="40" cy="6"  r="3" fill="#10B981"/>
  <circle cx="74" cy="40" r="3" fill="#10B981"/>
  <circle cx="40" cy="74" r="3" fill="#10B981"/>
  <circle cx="6"  cy="40" r="3" fill="#10B981"/>
</svg>
