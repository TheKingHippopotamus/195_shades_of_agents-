<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>Tier Pyramid</title>
  <!-- Pyramid tiers (widening downward) -->
  <polygon points="12,2 16,8 8,8"   stroke-linejoin="round"/>
  <polygon points="7,10 17,10 19,16 5,16" stroke-linejoin="round"/>
  <polygon points="4,18 20,18 22,24 2,24"  stroke-linejoin="round"/>
  <!-- Tier dividers -->
  <line x1="8"  y1="8"  x2="16" y2="8"  stroke-width="1.25" opacity="0.6"/>
  <line x1="5"  y1="16" x2="19" y2="16" stroke-width="1.25" opacity="0.6"/>
</svg>
