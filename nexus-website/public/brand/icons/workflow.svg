<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>Workflow</title>
  <!-- Start node -->
  <circle cx="4"  cy="12" r="2.5"/>
  <!-- End node -->
  <circle cx="20" cy="12" r="2.5"/>
  <!-- Top branch node -->
  <circle cx="12" cy="5"  r="2.5"/>
  <!-- Bottom branch node -->
  <circle cx="12" cy="19" r="2.5"/>
  <!-- Connections -->
  <line x1="6.5"  y1="12" x2="9.5"  y2="12" stroke-width="1.5"/>
  <line x1="14.5" y1="12" x2="17.5" y2="12" stroke-width="1.5"/>
  <!-- Branch from mid -->
  <line x1="12" y1="7.5"  x2="12" y2="9"  stroke-width="1.5"/>
  <line x1="12" y1="15"   x2="12" y2="16.5" stroke-width="1.5"/>
  <!-- Diamond center split -->
  <line x1="6.5"  y1="11"  x2="9.5"  y2="7.5"  stroke-width="1.5"/>
  <line x1="6.5"  y1="13"  x2="9.5"  y2="16.5" stroke-width="1.5"/>
  <line x1="14.5" y1="7.5" x2="17.5" y2="11"   stroke-width="1.5"/>
  <line x1="14.5" y1="16.5" x2="17.5" y2="13"  stroke-width="1.5"/>
</svg>
