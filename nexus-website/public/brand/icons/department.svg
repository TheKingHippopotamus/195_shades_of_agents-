<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>Department Org Chart</title>
  <!-- Root node -->
  <rect x="9" y="2" width="6" height="4" rx="1"/>
  <!-- Line down -->
  <line x1="12" y1="6" x2="12" y2="9"/>
  <!-- Branch -->
  <line x1="6" y1="9" x2="18" y2="9"/>
  <!-- Left branch down -->
  <line x1="6" y1="9" x2="6" y2="12"/>
  <!-- Right branch down -->
  <line x1="18" y1="9" x2="18" y2="12"/>
  <!-- Left child -->
  <rect x="3"  y="12" width="6" height="4" rx="1"/>
  <!-- Right child -->
  <rect x="15" y="12" width="6" height="4" rx="1"/>
  <!-- Left grandchildren -->
  <line x1="6"  y1="16" x2="6"  y2="19"/>
  <line x1="4"  y1="19" x2="8"  y2="19"/>
  <circle cx="4"  cy="20.5" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="8"  cy="20.5" r="1.5" fill="currentColor" stroke="none"/>
  <!-- Right grandchildren -->
  <line x1="18" y1="16" x2="18" y2="19"/>
  <line x1="16" y1="19" x2="20" y2="19"/>
  <circle cx="16" cy="20.5" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="20.5" r="1.5" fill="currentColor" stroke="none"/>
</svg>
