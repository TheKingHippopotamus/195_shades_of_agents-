<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Governance</title>
  <!-- Hexagonal gate/portal -->
  <!-- Large hex: center (24,24), r=20 -->
  <!-- Vertices: (24,4),(41.32,14),(41.32,34),(24,44),(6.68,34),(6.68,14) -->
  <polygon points="24,4 41.32,14 41.32,34 24,44 6.68,34 6.68,14"
           fill="none" stroke="#EF4444" stroke-width="2"/>
  <!-- Inner hex: r=13 -->
  <!-- Vertices: (24,11),(35.26,17.5),(35.26,30.5),(24,37),(12.74,30.5),(12.74,17.5) -->
  <polygon points="24,11 35.26,17.5 35.26,30.5 24,37 12.74,30.5 12.74,17.5"
           fill="none" stroke="#EF4444" stroke-width="1" opacity="0.4"/>
  <!-- Gate approval stamp (circle + checkmark) -->
  <circle cx="24" cy="24" r="8" fill="none" stroke="#EF4444" stroke-width="2"/>
  <polyline points="18,24 22,28 30,20" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 6 gate connector dots -->
  <circle cx="24"    cy="4"     r="2" fill="#EF4444"/>
  <circle cx="41.32" cy="14"    r="2" fill="#EF4444" opacity="0.6"/>
  <circle cx="41.32" cy="34"    r="2" fill="#EF4444" opacity="0.6"/>
  <circle cx="24"    cy="44"    r="2" fill="#EF4444"/>
  <circle cx="6.68"  cy="34"    r="2" fill="#EF4444" opacity="0.6"/>
  <circle cx="6.68"  cy="14"    r="2" fill="#EF4444" opacity="0.6"/>
</svg>
