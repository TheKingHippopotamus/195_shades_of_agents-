<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Special Agents</title>
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>
  <!-- Orbital ellipse -->
  <ellipse cx="24" cy="24" rx="20" ry="10" fill="none" stroke="url(#sg)" stroke-width="1.5" transform="rotate(-30,24,24)"/>
  <ellipse cx="24" cy="24" rx="20" ry="10" fill="none" stroke="url(#sg)" stroke-width="1.5" transform="rotate(30,24,24)" opacity="0.6"/>
  <!-- Central star (5-pointed) -->
  <polygon points="24,8 26.94,17.09 36.51,17.09 28.78,22.91 31.72,32 24,26.18 16.28,32 19.22,22.91 11.49,17.09 21.06,17.09"
           fill="url(#sg)" opacity="0.9"/>
  <!-- Orbital nodes -->
  <circle cx="4"  cy="24" r="2.5" fill="#7C3AED"/>
  <circle cx="44" cy="24" r="2.5" fill="#00D9FF"/>
  <circle cx="24" cy="4"  r="2"   fill="#7C3AED" opacity="0.7"/>
  <circle cx="24" cy="44" r="2"   fill="#00D9FF" opacity="0.7"/>
</svg>
