<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Design</title>
  <!-- Pen nib body -->
  <path d="M24,42 L12,24 L24,6 L36,24 Z"
        fill="none" stroke="#EC4899" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner nib split -->
  <line x1="24" y1="42" x2="24" y2="26" stroke="#EC4899" stroke-width="1.5" opacity="0.6"/>
  <!-- Nib tip -->
  <circle cx="24" cy="42" r="2" fill="#EC4899"/>
  <!-- Cross section line -->
  <line x1="15" y1="26" x2="33" y2="26" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Decorative creative circles (grid) -->
  <circle cx="8"  cy="8"  r="2" fill="none" stroke="#EC4899" stroke-width="1.25" opacity="0.4"/>
  <circle cx="16" cy="8"  r="2" fill="none" stroke="#EC4899" stroke-width="1.25" opacity="0.4"/>
  <circle cx="40" cy="8"  r="2" fill="none" stroke="#EC4899" stroke-width="1.25" opacity="0.4"/>
  <circle cx="40" cy="16" r="2" fill="none" stroke="#EC4899" stroke-width="1.25" opacity="0.4"/>
  <circle cx="40" cy="24" r="2" fill="none" stroke="#EC4899" stroke-width="1.25" opacity="0.4"/>
  <!-- Color palette dots top right -->
  <circle cx="40" cy="6"  r="2.5" fill="#EC4899" opacity="0.8"/>
  <circle cx="44" cy="12" r="2"   fill="#7C3AED" opacity="0.7"/>
  <circle cx="44" cy="20" r="2"   fill="#00D9FF" opacity="0.7"/>
</svg>
