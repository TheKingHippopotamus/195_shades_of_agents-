<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Documentation</title>
  <!-- Paper stack (back) -->
  <rect x="12" y="10" width="30" height="36" rx="2" fill="none" stroke="#6B7280" stroke-width="1.5" opacity="0.4"/>
  <!-- Paper stack (mid) -->
  <rect x="8"  y="7"  width="30" height="36" rx="2" fill="none" stroke="#6B7280" stroke-width="1.5" opacity="0.6"/>
  <!-- Main document -->
  <rect x="4"  y="4"  width="30" height="36" rx="3" fill="#0A0E27" stroke="#6B7280" stroke-width="2"/>
  <!-- Text lines -->
  <line x1="10" y1="12" x2="28" y2="12" stroke="#6B7280" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="10" y1="17" x2="28" y2="17" stroke="#6B7280" stroke-width="1.5"  stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="22" x2="22" y2="22" stroke="#6B7280" stroke-width="1.5"  stroke-linecap="round" opacity="0.7"/>
  <line x1="10" y1="27" x2="28" y2="27" stroke="#6B7280" stroke-width="1.5"  stroke-linecap="round" opacity="0.5"/>
  <line x1="10" y1="32" x2="24" y2="32" stroke="#6B7280" stroke-width="1.5"  stroke-linecap="round" opacity="0.5"/>
  <!-- Bookmark -->
  <path d="M26,4 L26,16 L29,13 L32,16 L32,4"
        fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Quill pen -->
  <path d="M30,44 Q38,36 44,20 Q40,22 36,28 Q34,38 30,44 Z"
        fill="none" stroke="#6B7280" stroke-width="1.75" stroke-linejoin="round" opacity="0.8"/>
  <line x1="30" y1="44" x2="38" y2="36" stroke="#6B7280" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
</svg>
