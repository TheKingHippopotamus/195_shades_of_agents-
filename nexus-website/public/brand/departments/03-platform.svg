<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Platform Infrastructure</title>
  <!-- Cloud shape -->
  <path d="M10,28 Q8,28 8,24 Q8,18 14,18 Q15,12 22,12 Q30,12 32,18 Q38,18 38,24 Q38,28 36,28 Z"
        fill="none" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
  <!-- Server rack -->
  <rect x="10" y="32" width="28" height="6"  rx="1.5" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <rect x="10" y="40" width="28" height="5"  rx="1.5" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <!-- Server status lights -->
  <circle cx="14" cy="35" r="1.5" fill="#3B82F6"/>
  <circle cx="18" cy="35" r="1.5" fill="#10B981" opacity="0.8"/>
  <circle cx="14" cy="42.5" r="1.5" fill="#3B82F6" opacity="0.7"/>
  <!-- Up arrow from cloud to sky -->
  <line x1="24" y1="4" x2="24" y2="11" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <polyline points="20,7 24,3 28,7" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Connection lines cloud → server -->
  <line x1="20" y1="28" x2="20" y2="32" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.6"/>
  <line x1="28" y1="28" x2="28" y2="32" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.6"/>
</svg>
