<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Legal &amp; Compliance</title>
  <!-- Central pillar -->
  <line x1="24" y1="6" x2="24" y2="44" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Horizontal balance beam -->
  <line x1="8"  y1="16" x2="40" y2="16" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <!-- Scale chains (left) -->
  <line x1="12" y1="16" x2="12" y2="24" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="10" y2="24" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left scale pan -->
  <path d="M6,28 Q10,26 14,28" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <!-- Scale chains (right) -->
  <line x1="36" y1="16" x2="36" y2="24" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="16" x2="38" y2="24" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right scale pan -->
  <path d="M32,28 Q36,26 40,28" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <!-- Top dot (balance point) -->
  <circle cx="24" cy="6"  r="2.5" fill="#6366F1"/>
  <!-- Base -->
  <path d="M16,44 L32,44" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M20,40 L28,40" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Pan contents (dots suggesting documents/evidence) -->
  <circle cx="10" cy="30" r="1" fill="#6366F1" opacity="0.6"/>
  <circle cx="36" cy="30" r="1" fill="#6366F1" opacity="0.6"/>
</svg>
