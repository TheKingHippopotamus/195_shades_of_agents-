<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Product Management</title>
  <!-- Roadmap timeline arrow -->
  <line x1="6" y1="24" x2="36" y2="24" stroke="#8B5CF6" stroke-width="2"/>
  <polyline points="33,20 38,24 33,28" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Milestone 1 (discovery) -->
  <polygon points="12,18 16,22 12,26 8,22" fill="none" stroke="#8B5CF6" stroke-width="1.75"/>
  <circle cx="12" cy="22" r="1.5" fill="#8B5CF6"/>
  <!-- Milestone 2 (build) -->
  <polygon points="24,17 28,22 24,27 20,22" fill="none" stroke="#8B5CF6" stroke-width="1.75"/>
  <circle cx="24" cy="22" r="1.5" fill="#8B5CF6"/>
  <!-- Milestone 3 (launch - filled) -->
  <polygon points="36,17 40,22 36,27 32,22" fill="#8B5CF6" opacity="0.3" stroke="#8B5CF6" stroke-width="1.75"/>
  <circle cx="36" cy="22" r="2" fill="#8B5CF6"/>
  <!-- Stage labels (dots below) -->
  <circle cx="12" cy="32" r="1" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="24" cy="32" r="1" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="36" cy="32" r="1.5" fill="#8B5CF6" opacity="0.7"/>
  <!-- Top target lines -->
  <line x1="8"  y1="11" x2="16" y2="11" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="20" y1="8"  x2="28" y2="8"  stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="5"  x2="40" y2="5"  stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Vertical stems -->
  <line x1="12" y1="11" x2="12" y2="18" stroke="#8B5CF6" stroke-width="1" opacity="0.4" stroke-dasharray="2,1"/>
  <line x1="24" y1="8"  x2="24" y2="17" stroke="#8B5CF6" stroke-width="1" opacity="0.4" stroke-dasharray="2,1"/>
  <line x1="36" y1="5"  x2="36" y2="17" stroke="#8B5CF6" stroke-width="1" opacity="0.7" stroke-dasharray="2,1"/>
</svg>
