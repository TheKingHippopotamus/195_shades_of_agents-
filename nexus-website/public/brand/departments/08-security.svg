<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Security</title>
  <!-- Padlock body -->
  <rect x="10" y="22" width="28" height="22" rx="4" fill="none" stroke="#EF4444" stroke-width="2"/>
  <!-- Padlock shackle -->
  <path d="M16,22 L16,14 Q16,6 24,6 Q32,6 32,14 L32,22"
        fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="24" cy="32" r="3.5" fill="none" stroke="#EF4444" stroke-width="1.75"/>
  <line x1="24" y1="35.5" x2="24" y2="40" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <!-- Hex pattern overlay (security grid) -->
  <line x1="10" y1="28" x2="38" y2="28" stroke="#EF4444" stroke-width="0.75" opacity="0.25" stroke-dasharray="3,2"/>
  <line x1="10" y1="35" x2="38" y2="35" stroke="#EF4444" stroke-width="0.75" opacity="0.25" stroke-dasharray="3,2"/>
  <!-- Corner security dots -->
  <circle cx="12" cy="24" r="1.5" fill="#EF4444" opacity="0.5"/>
  <circle cx="36" cy="24" r="1.5" fill="#EF4444" opacity="0.5"/>
  <!-- Alert indicator -->
  <circle cx="36" cy="12" r="4" fill="#EF4444" opacity="0.15" stroke="#EF4444" stroke-width="1.5"/>
  <line x1="36" y1="9" x2="36" y2="13" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="15" r="1" fill="#EF4444"/>
</svg>
