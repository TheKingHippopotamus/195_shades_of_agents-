<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Data Science &amp; AI/ML</title>
  <!-- Neural network: 3 input nodes, 2 hidden, 1 output -->
  <!-- Input layer (x=8) -->
  <circle cx="8"  cy="12" r="3.5" fill="none" stroke="#F59E0B" stroke-width="1.75"/>
  <circle cx="8"  cy="24" r="3.5" fill="none" stroke="#F59E0B" stroke-width="1.75"/>
  <circle cx="8"  cy="36" r="3.5" fill="none" stroke="#F59E0B" stroke-width="1.75"/>
  <!-- Hidden layer (x=24) -->
  <circle cx="24" cy="16" r="3.5" fill="none" stroke="#F59E0B" stroke-width="1.75"/>
  <circle cx="24" cy="32" r="3.5" fill="none" stroke="#F59E0B" stroke-width="1.75"/>
  <!-- Output layer (x=40) -->
  <circle cx="40" cy="24" r="4"   fill="#F59E0B" opacity="0.3" stroke="#F59E0B" stroke-width="2"/>
  <!-- Connections input→hidden -->
  <line x1="11.5" y1="12" x2="20.5" y2="16" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <line x1="11.5" y1="12" x2="20.5" y2="32" stroke="#F59E0B" stroke-width="1" opacity="0.2"/>
  <line x1="11.5" y1="24" x2="20.5" y2="16" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  <line x1="11.5" y1="24" x2="20.5" y2="32" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  <line x1="11.5" y1="36" x2="20.5" y2="16" stroke="#F59E0B" stroke-width="1" opacity="0.2"/>
  <line x1="11.5" y1="36" x2="20.5" y2="32" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <!-- Connections hidden→output -->
  <line x1="27.5" y1="16" x2="36"   y2="24" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
  <line x1="27.5" y1="32" x2="36"   y2="24" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
  <!-- Inner dot output node -->
  <circle cx="40" cy="24" r="1.5" fill="#F59E0B"/>
  <!-- Inner dots active nodes -->
  <circle cx="8"  cy="24" r="1.5" fill="#F59E0B"/>
  <circle cx="24" cy="16" r="1.5" fill="#F59E0B"/>
</svg>
