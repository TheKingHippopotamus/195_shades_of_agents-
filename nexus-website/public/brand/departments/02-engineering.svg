<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Engineering</title>
  <!-- Terminal window frame -->
  <rect x="4" y="8" width="40" height="32" rx="3" fill="none" stroke="#10B981" stroke-width="2"/>
  <!-- Window title bar dots -->
  <circle cx="11" cy="14" r="2" fill="#EF4444" opacity="0.7"/>
  <circle cx="18" cy="14" r="2" fill="#F59E0B" opacity="0.7"/>
  <circle cx="25" cy="14" r="2" fill="#10B981" opacity="0.7"/>
  <!-- Title bar separator -->
  <line x1="4" y1="19" x2="44" y2="19" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <!-- Code: < / > symbol -->
  <polyline points="13,28 9,24 13,20" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="21" y1="19" x2="19" y2="29" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <polyline points="27,20 31,24 27,28" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal code lines -->
  <line x1="35" y1="21" x2="41" y2="21" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="35" y1="24" x2="39" y2="24" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="35" y1="27" x2="41" y2="27" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Circuit nodes at corners -->
  <circle cx="6"  cy="10" r="1.5" fill="#10B981" opacity="0.6"/>
  <circle cx="42" cy="10" r="1.5" fill="#10B981" opacity="0.6"/>
</svg>
